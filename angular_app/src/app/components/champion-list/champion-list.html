<div class="page">
  <h2>Champions ({{ filteredChampions.length }})</h2>

  <div class="filters-bar">
    <input type="text" placeholder="Search by name…" [ngModel]="search()" (ngModelChange)="search.set($event)" />
    <select [ngModel]="role()" (ngModelChange)="role.set($event)" >
      <option value="">All roles</option>
      @for (r of roles; track r) {
      <option [value]="r">{{ r }}</option>
      }
    </select>
  </div>

  @if (loading()) {
  <p class="loading-msg">Loading champions…</p>
  } @else if (error()) {
  <p class="error-msg">{{ error() }}</p>
  } @else {
  <div class="champion-grid">
    @for (champ of paginatedChampions; track champ.id) {
    <a [routerLink]="['/champions', champ.id]" class="champion-card">
      @if (champ.image.full) {
      <img [src]="getImageUrl(champ.image.full)" [alt]="champ.name" width="120" />
      } @else {
      <div class="placeholder-img">?</div>
      }
      <p class="champion-card-name">{{ champ.name }}</p>
    </a>
    }
  </div>

  <app-pagination [page]="page()" [totalPages]="totalPages" (pageChange)="onPageChange($event)" />
  }
</div>
