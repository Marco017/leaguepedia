<div class="app-shell">
  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar-logo" aria-hidden="true">L</div>

    <ul class="sidebar-nav" role="list">
      <li>
        <a routerLink="/home" routerLinkActive="active" title="Home" aria-label="Home">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a routerLink="/champions" routerLinkActive="active" title="Champions" aria-label="Champions">
          <i class="fa-solid fa-person-rays" aria-hidden="true"></i>
        </a>
      </li>


      @if (auth.isAuthenticated()) {
      <li>
        <a routerLink="/admin" routerLinkActive="active" title="Admin area" aria-label="Admin">
          <i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <button class="sidebar-btn" (click)="logout()" title="Logout" aria-label="Logout">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </button>
      </li>
      } @else {
      <li>
        <a routerLink="/login" routerLinkActive="active" title="Login" aria-label="Login">
          <i class="fa-solid fa-user" aria-hidden="true"></i>
        </a>
      </li>
      }
    </ul>
  </nav>

  <main class="main-content">
    
    <h1 class="app-title">Leaguepedia</h1>
    <router-outlet />
  </main>
</div>
